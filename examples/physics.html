<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics - Famous Engine</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .back-link {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #e94560;
      text-decoration: none;
      font-family: sans-serif;
      z-index: 1000;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #a0a0a0;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">Back to Examples</a>
  <div id="app"></div>
  <div class="info">Click anywhere to add a new particle</div>

  <script src="../dist/famous.umd.js"></script>
  <script>
    // Physics Example - Particle System
    var FamousEngine = famous.core.FamousEngine;
    var DOMElement = famous.domRenderables.DOMElement;
    var PhysicsEngine = famous.physics.PhysicsEngine;
    var Particle = famous.physics.Particle;
    var Gravity1D = famous.physics.Gravity1D;
    var Wall = famous.physics.Wall;
    var Vec3 = famous.math.Vec3;

    FamousEngine.init();
    var scene = FamousEngine.createScene('#app');

    // Title
    var title = scene.addChild();
    title.getComponent(0).setAlign(0.5, 0.08, 0);
    title.getComponent(0).setMountPoint(0.5, 0.5, 0);
    title.setSizeMode(1, 1, 1);
    title.setAbsoluteSize(600, 50, 0);

    new DOMElement(title, {
      content: 'Physics Engine Demo',
      properties: {
        'color': '#e94560',
        'font-family': 'sans-serif',
        'font-size': '36px',
        'font-weight': 'bold',
        'text-align': 'center'
      }
    });

    // Create physics engine
    var physics = new PhysicsEngine();

    // Add gravity
    var gravity = new Gravity1D(null, {
      gravity: new Vec3(0, 200, 0)
    });
    physics.add(gravity);

    // Track particles and their DOM nodes
    var particles = [];
    var colors = ['#e94560', '#ff6b6b', '#00a8cc', '#533483', '#0f3460'];

    function createParticle(x, y) {
      // Create physics particle
      var particle = new Particle({
        mass: 1,
        position: new Vec3(x, y, 0),
        velocity: new Vec3(
          (Math.random() - 0.5) * 200,
          (Math.random() - 0.5) * 200,
          0
        )
      });
      physics.add(particle);
      gravity.addTarget(particle);

      // Create DOM node
      var node = scene.addChild();
      node.setSizeMode(1, 1, 1);
      var size = 30 + Math.random() * 30;
      node.setAbsoluteSize(size, size, 0);

      var color = colors[Math.floor(Math.random() * colors.length)];
      new DOMElement(node, {
        properties: {
          'background': color,
          'border-radius': '50%',
          'box-shadow': '0 4px 20px ' + color + '80'
        }
      });

      particles.push({ particle: particle, node: node, size: size });

      // Remove after 5 seconds
      setTimeout(function() {
        var index = particles.findIndex(function(p) { return p.particle === particle; });
        if (index > -1) {
          physics.remove(particle);
          gravity.removeTarget(particle);
          scene.removeChild(node);
          particles.splice(index, 1);
        }
      }, 5000);
    }

    // Update loop
    FamousEngine.requestUpdate({
      onUpdate: function(time) {
        // Update physics
        physics.update(time);

        // Update DOM positions
        particles.forEach(function(p) {
          var pos = p.particle.getPosition();
          var transform = p.node.getComponent(0);
          transform.setPosition(pos.x - p.size/2, pos.y - p.size/2, 0);
        });

        FamousEngine.requestUpdateOnNextTick(this);
      }
    });

    // Create initial particles
    for (var i = 0; i < 10; i++) {
      setTimeout(function() {
        createParticle(
          window.innerWidth * 0.3 + Math.random() * window.innerWidth * 0.4,
          window.innerHeight * 0.2
        );
      }, i * 100);
    }

    // Click to add particles
    document.addEventListener('click', function(e) {
      createParticle(e.clientX, e.clientY);
    });
  </script>
</body>
</html>

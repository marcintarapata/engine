<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation - Famous Engine</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .back-link {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #e94560;
      text-decoration: none;
      font-family: sans-serif;
      z-index: 1000;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }
    .controls button {
      padding: 12px 24px;
      margin: 0 10px;
      font-size: 16px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: sans-serif;
      transition: background 0.2s;
    }
    .controls button:hover {
      background: #ff6b6b;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">Back to Examples</a>
  <div id="app"></div>

  <div class="controls">
    <button onclick="animatePosition()">Animate Position</button>
    <button onclick="animateRotation()">Animate Rotation</button>
    <button onclick="animateScale()">Animate Scale</button>
    <button onclick="animateAll()">Animate All</button>
  </div>

  <script src="../dist/famous.umd.js"></script>
  <script>
    // Animation Example
    var FamousEngine = famous.core.FamousEngine;
    var DOMElement = famous.domRenderables.DOMElement;
    var Position = famous.components.Position;
    var Rotation = famous.components.Rotation;
    var Scale = famous.components.Scale;

    FamousEngine.init();
    var scene = FamousEngine.createScene('#app');

    // Create animated box
    var node = scene.addChild();
    var transform = node.getComponent(0);

    transform.setAlign(0.5, 0.4, 0);
    transform.setMountPoint(0.5, 0.5, 0);
    transform.setOrigin(0.5, 0.5, 0);

    node.setSizeMode(1, 1, 1);
    node.setAbsoluteSize(150, 150, 0);

    new DOMElement(node, {
      content: 'Animate Me!',
      properties: {
        'background': 'linear-gradient(135deg, #e94560 0%, #ff6b6b 100%)',
        'color': 'white',
        'font-family': 'sans-serif',
        'font-size': '18px',
        'font-weight': 'bold',
        'text-align': 'center',
        'line-height': '150px',
        'border-radius': '12px',
        'box-shadow': '0 10px 40px rgba(233, 69, 96, 0.4)'
      }
    });

    // Create component instances for animation
    var position = new Position(node);
    var rotation = new Rotation(node);
    var scale = new Scale(node);

    // Animation state
    var positionState = 0;
    var rotationState = 0;
    var scaleState = 0;

    // Animation functions
    window.animatePosition = function() {
      positionState = (positionState + 1) % 2;
      var x = positionState === 1 ? 100 : 0;
      var y = positionState === 1 ? -50 : 0;

      position.set(x, y, 0, {
        duration: 800,
        curve: 'easeInOut'
      });
    };

    window.animateRotation = function() {
      rotationState = (rotationState + 1) % 2;
      var angle = rotationState === 1 ? Math.PI * 2 : 0;

      rotation.set(0, 0, angle, {
        duration: 1000,
        curve: 'easeInOut'
      });
    };

    window.animateScale = function() {
      scaleState = (scaleState + 1) % 2;
      var s = scaleState === 1 ? 1.5 : 1;

      scale.set(s, s, 1, {
        duration: 600,
        curve: 'easeInOut'
      });
    };

    window.animateAll = function() {
      animatePosition();
      animateRotation();
      animateScale();
    };

    // Title
    var titleNode = scene.addChild();
    titleNode.getComponent(0).setAlign(0.5, 0.1, 0);
    titleNode.getComponent(0).setMountPoint(0.5, 0.5, 0);
    titleNode.setSizeMode(1, 1, 1);
    titleNode.setAbsoluteSize(400, 50, 0);

    new DOMElement(titleNode, {
      content: 'Animation Example',
      properties: {
        'color': '#e94560',
        'font-family': 'sans-serif',
        'font-size': '32px',
        'font-weight': 'bold',
        'text-align': 'center'
      }
    });
  </script>
</body>
</html>

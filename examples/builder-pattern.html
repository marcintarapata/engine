<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Builder Pattern - Famous Engine</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .back-link {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #e94560;
      text-decoration: none;
      font-family: sans-serif;
      z-index: 1000;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">Back to Examples</a>
  <div id="app"></div>

  <script src="../dist/famous.umd.js"></script>
  <script>
    // Modern Builder API Example
    var createEngine = famous.createEngine;
    var createScene = famous.createScene;
    var createNode = famous.createNode;
    var DOMElement = famous.domRenderables.DOMElement;

    // Create engine with fluent builder
    var engine = createEngine()
      .withAutoStart()
      .build();

    // Create scene using builder
    var scene = createScene('#app', engine).build();

    // Create title node
    var title = createNode(scene)
      .withAlign(0.5, 0.3, 0)
      .withMountPoint(0.5, 0.5, 0)
      .build();

    title.setSizeMode(1, 1, 1);
    title.setAbsoluteSize(600, 60, 0);

    new DOMElement(title, {
      content: 'Builder Pattern Example',
      properties: {
        'color': '#e94560',
        'font-family': '-apple-system, BlinkMacSystemFont, sans-serif',
        'font-size': '36px',
        'font-weight': 'bold',
        'text-align': 'center'
      }
    });

    // Create multiple boxes using builder pattern
    var colors = ['#e94560', '#0f3460', '#16213e', '#533483', '#00a8cc'];
    var boxes = [];

    for (var i = 0; i < 5; i++) {
      var box = createNode(scene)
        .withAlign(0.2 + (i * 0.15), 0.6, 0)
        .withMountPoint(0.5, 0.5, 0)
        .withRotation(0, 0, (i * 0.2))
        .withScale(1 + (i * 0.1), 1 + (i * 0.1), 1)
        .build();

      box.setSizeMode(1, 1, 1);
      box.setAbsoluteSize(80, 80, 0);

      new DOMElement(box, {
        content: String(i + 1),
        properties: {
          'background-color': colors[i],
          'color': '#ffffff',
          'font-family': 'sans-serif',
          'font-size': '24px',
          'font-weight': 'bold',
          'text-align': 'center',
          'line-height': '80px',
          'border-radius': '8px',
          'box-shadow': '0 4px 20px rgba(0,0,0,0.3)'
        }
      });

      boxes.push(box);
    }

    // Subtitle
    var subtitle = createNode(scene)
      .withAlign(0.5, 0.85, 0)
      .withMountPoint(0.5, 0.5, 0)
      .withOpacity(0.7)
      .build();

    subtitle.setSizeMode(1, 1, 1);
    subtitle.setAbsoluteSize(600, 40, 0);

    new DOMElement(subtitle, {
      content: 'Each box created with createNode().withAlign().withRotation().withScale().build()',
      properties: {
        'color': '#a0a0a0',
        'font-family': 'monospace',
        'font-size': '14px',
        'text-align': 'center'
      }
    });
  </script>
</body>
</html>
